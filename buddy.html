<!doctype html>
<html><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src data:; style-src 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<!--
  Kopi the buddy (buddy-main.cjs): one see-through layer over the screen. Kopi, the frame that shows
  what he looks at, and his card all live here, so nothing but this page moves while you drag him:
  he glides after the mouse on a little spring and leans into the movement. The layer only catches the
  mouse where Kopi or the card is; everywhere else your clicks go straight through.
-->
<style>
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:"Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;user-select:none}
  #kopi{position:absolute;left:0;top:0;width:140px;height:140px;margin:-70px 0 0 -70px;opacity:0;cursor:grab;will-change:transform}
  #kopi.grabbing{cursor:grabbing}
  #kopi img{width:140px;height:140px;display:block;pointer-events:none}
  #shadow{position:absolute;left:0;top:0;width:84px;height:16px;margin:-8px 0 0 -42px;border-radius:50%;background:radial-gradient(rgba(0,0,0,.35),transparent 70%);opacity:0;pointer-events:none;will-change:transform}

  #lens{position:absolute;opacity:0;pointer-events:none;border-radius:14px;transition:opacity .2s,left .14s ease-out,top .14s ease-out,width .14s ease-out,height .14s ease-out;
    box-shadow:0 0 0 2.5px #8fb8ff,0 0 0 4px rgba(0,0,0,.25),0 0 30px rgba(143,184,255,.55),inset 0 0 30px rgba(143,184,255,.16);background:rgba(143,184,255,.045);overflow:hidden}
  #lens.home{box-shadow:0 0 0 2.5px #9be37a,0 0 0 4px rgba(0,0,0,.25),0 0 30px rgba(155,227,122,.6),inset 0 0 30px rgba(155,227,122,.18);background:rgba(155,227,122,.07)}
  #lens.home .label{background:#9be37a}
  #lens .label{position:absolute;left:14px;top:12px;padding:5px 12px;border-radius:999px;background:#8fb8ff;color:#0b1020;font:600 12.5px inherit;font-family:inherit;white-space:nowrap}
  #lens .scan{position:absolute;left:0;top:0;width:100%;height:100%;background:linear-gradient(transparent 70%,rgba(143,184,255,.22) 92%,rgba(143,184,255,.5) 100%);display:none;will-change:transform}
  #lens.scanning .scan{display:block;animation:scan 1s ease-in-out infinite}
  @keyframes scan{from{transform:translateY(-100%)}to{transform:translateY(0)}}

  #card{position:absolute;width:380px;max-height:70vh;display:none;flex-direction:column;gap:12px;padding:16px 16px 14px;box-sizing:border-box;
    background:#111114;color:#f2f2f4;border-radius:22px;box-shadow:0 0 0 1px #2a2a31,0 18px 50px rgba(0,0,0,.55);transform-origin:var(--ox,0) 30px}
  #card.open{display:flex;animation:pop .26s cubic-bezier(.2,1.3,.4,1)}
  @keyframes pop{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:none}}
  #card.closing{display:flex;animation:out .18s ease-in forwards}
  @keyframes out{to{opacity:0;transform:scale(.9)}}
  .head{display:flex;align-items:center;gap:8px;font-size:12px;color:#9a9aa6}
  .head b{color:#fff;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;font-size:13px}
  .x{margin-left:auto;width:28px;height:28px;border-radius:50%;border:0;background:#24242b;color:#bbb;font-size:15px;cursor:pointer;flex:none}
  .x:hover{background:#34343d;color:#fff}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chips button,.row button{border:0;border-radius:999px;padding:8px 14px;background:#24242b;color:#f2f2f4;font:600 13px inherit;font-family:inherit;cursor:pointer;transition:background .12s,transform .12s}
  .chips button:hover,.row button:hover{background:#33333c}
  .chips button:active,.row button:active{transform:scale(.96)}
  .row button.main{background:#d9f5b0;color:#173b06}
  .ask{display:flex;gap:8px;align-items:flex-end}
  textarea{flex:1;resize:none;height:40px;max-height:110px;border:0;border-radius:14px;padding:10px 12px;box-sizing:border-box;background:#1d1d23;color:#fff;font:14px inherit;font-family:inherit;outline:none;user-select:text}
  textarea:focus{box-shadow:0 0 0 2px #5b6cff}
  .send{width:40px;height:40px;border-radius:50%;border:0;background:#fff;color:#111;font-size:18px;cursor:pointer;flex:none}
  .wait{display:flex;align-items:center;gap:10px;color:#c9c9d2;font-size:14px;padding:4px 2px}
  .dots i{display:inline-block;width:7px;height:7px;margin-right:4px;border-radius:50%;background:#8fb8ff;animation:b 1s infinite}
  .dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
  @keyframes b{0%,100%{opacity:.25;transform:none}50%{opacity:1;transform:translateY(-3px)}}
  .q{font-size:13px;color:#9a9aa6}
  .seen img{width:100%;max-height:140px;object-fit:cover;border-radius:12px;box-shadow:0 0 0 1px #2a2a31;display:block;margin-top:6px}
  .answer{font-size:15px;line-height:1.5;max-height:40vh;overflow:auto;user-select:text;padding-right:4px}
  .answer ul{margin:6px 0;padding-left:18px}
  .fixes{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
  .fixes li{background:#1a1a20;border-radius:12px;padding:8px 10px;font-size:13px;line-height:1.4}
  .fixes .p{color:#8a8a96;font-size:11px;margin-right:6px}
  .fixes del{color:#ff8f8f;text-decoration-color:#ff8f8f}
  .fixes ins{color:#9be37a;text-decoration:none}
  .fixes .why{display:block;color:#8a8a96;font-size:12px;margin-top:2px}
  .row{display:flex;flex-wrap:wrap;gap:8px}
  .err{color:#ffb4a8;font-size:14px;line-height:1.45}
  ::-webkit-scrollbar{width:6px}::-webkit-scrollbar-thumb{background:#3a3a44;border-radius:3px}
</style></head>
<body>
<div id="lens"><span class="label" id="lensLabel"></span><div class="scan"></div></div>
<div id="shadow"></div>
<div id="kopi"><img id="face" alt=""></div>
<div id="card"></div>
<script>
const $ = s => document.querySelector(s), card = $('#card'), kopi = $('#kopi'), lens = $('#lens');
let lang = 'en', info = {}, lastQuestion = '', answerText = '';
const testing = new URLSearchParams(location.search).has('test');
const T = {
  ms: { lensCarry: '👀 Kopi melihat di sini', lensLook: '👀 Sedang melihat…', lensApp: a => '👀 ' + a, lensHome: '🏠 Lepaskan: balik ke rumah', seen: 'Ini yang saya nampak:', at: 'Kopi sedang melihat', here: 'bahagian skrin ini',
    placeholder: 'Tanya tentang apa yang ada di sini…', explain: 'Terangkan', spelling: 'Semak ejaan saya', translate: 'Terjemah', summary: 'Ringkaskan',
    thinking: 'Sedang berfikir…', copy: 'Salin', copied: 'Disalin ✓', again: 'Soalan baharu', home: 'Balik ke rumah', put: 'Masukkan ke Word',
    putting: 'Sedang dalam Word…', noFixes: 'Tiada kesilapan. Kemas! 🎉', pages: n => `${n} halaman dibaca`,
    put_done: (a, n) => `${a} daripada ${n} pembetulan ada dalam Word sebagai perubahan. Klik Terima atau Tolak dalam Word.`,
    wordHint: 'Saya membaca semua halaman, bukan hanya yang anda nampak.', close: 'Balik ke rumah' },
  en: { lensCarry: '👀 Kopi looks here', lensLook: '👀 Looking…', lensApp: a => '👀 ' + a, lensHome: '🏠 Let go: back home', seen: 'This is what I see:', at: 'Kopi is looking at', here: 'this part of the screen',
    placeholder: 'Ask about what is here…', explain: 'Explain', spelling: 'Check my spelling', translate: 'Translate', summary: 'Summarize',
    thinking: 'Thinking…', copy: 'Copy', copied: 'Copied ✓', again: 'New question', home: 'Go home', put: 'Put in Word',
    putting: 'Working in Word…', noFixes: 'No mistakes found. Nice! 🎉', pages: n => `Read ${n} pages`,
    put_done: (a, n) => `${a} of ${n} fixes are in Word as tracked changes. Accept or reject them in Word.`,
    wordHint: 'I read every page, not just what you see.', close: 'Go home' }
};
const t = key => T[lang][key];
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

// ---------- Kopi's body: a little spring, so he glides after the mouse and leans into it ----------
const P = { x: -999, y: -999 }, V = { x: 0, y: 0 }, aim = { x: -999, y: -999 };
let mode = 'home', scale = 1, alpha = 0, squashAt = -1, flight = null, letGoSent = false;
function frame(now) {
  requestAnimationFrame(frame);
  if (flight) { // flying home: an arc up into the island, getting smaller
    const k = clamp((now - flight.start) / 420, 0, 1), e = 1 - Math.pow(1 - k, 3);
    P.x = flight.from.x + (flight.to.x - flight.from.x) * e; P.y = flight.from.y + (flight.to.y - flight.from.y) * e - Math.sin(k * Math.PI) * 60;
    scale = 1 - 0.65 * e; alpha = 1 - clamp((k - 0.55) / 0.45, 0, 1);
    if (k >= 1 && !flight.done) { flight.done = true; alpha = 0; window.buddy.arrived(); }
  } else {
    const stiff = mode === 'carry' ? 0.28 : 0.2, damp = mode === 'carry' ? 0.6 : 0.7;
    V.x = (V.x + (aim.x - P.x) * stiff) * damp; V.y = (V.y + (aim.y - P.y) * stiff) * damp;
    P.x += V.x; P.y += V.y;
  }
  const lean = mode === 'carry' ? clamp(V.x * 1.4, -22, 22) : clamp(V.x * 0.8, -10, 10);
  const lift = mode === 'carry' ? -10 : 0;                       // held up a little while you carry him
  const bob = mode === 'carry' ? Math.sin(now / 140) * 2 : Math.sin(now / 520) * 3;
  let sx = scale, sy = scale;
  if (squashAt > 0) { const k = (now - squashAt) / 380; if (k < 1) { const w = Math.sin(k * Math.PI * 2) * (1 - k) * 0.12; sx *= 1 + w; sy *= 1 - w; } else squashAt = -1; }
  kopi.style.opacity = alpha;
  kopi.style.transform = `translate(${P.x}px, ${P.y + lift + bob}px) rotate(${lean}deg) scale(${sx}, ${sy})`;
  $('#shadow').style.opacity = mode === 'home' || flight ? 0 : alpha * (mode === 'carry' ? 0.5 : 0.9);
  $('#shadow').style.transform = `translate(${P.x}px, ${P.y + 62}px) scale(${mode === 'carry' ? 0.75 : 1})`;
}
requestAnimationFrame(frame);

// The frame: the window under Kopi, the same part of the screen that buddy-main.cjs captures.
function placeLens(r) { Object.assign(lens.style, { left: r.x + 'px', top: r.y + 'px', width: r.width + 'px', height: r.height + 'px' }); }
function setLens(state, app) {
  lens.style.opacity = state ? 1 : 0;
  lens.classList.toggle('home', state === 'home');
  lens.classList.toggle('scanning', state === 'look');
  if (state) $('#lensLabel').textContent = state === 'look' ? t('lensLook') : state === 'home' ? t('lensHome') : app ? t('lensApp')(app) : t('lensCarry');
}

// ---------- the card next to Kopi ----------
function md(text) { // **bold**, "- " lists and line breaks; everything else stays plain text
  const lines = esc(text).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').split('\n'); let html = '', list = false;
  for (const line of lines) {
    if (/^\s*[-•*]\s+/.test(line)) { if (!list) { html += '<ul>'; list = true; } html += '<li>' + line.replace(/^\s*[-•*]\s+/, '') + '</li>'; continue; }
    if (list) { html += '</ul>'; list = false; } html += line.trim() ? line + '<br>' : '<br>';
  }
  return (list ? html + '</ul>' : html).replace(/(<br>)+$/, '');
}
function head() { return `<div class="head"><span>${t('at')}</span><b>${esc(info.app || t('here'))}</b><button class="x" title="${t('close')}" data-do="home">✕</button></div>`; }
function placeCard() { // beside Kopi, on the side with room, kept on screen
  const w = 380, h = card.offsetHeight || 300, right = aim.x + 80 + w < innerWidth - 12;
  const x = right ? aim.x + 76 : aim.x - 76 - w, y = clamp(aim.y - 70, 12, innerHeight - h - 12);
  card.style.left = clamp(x, 12, innerWidth - w - 12) + 'px'; card.style.top = y + 'px';
  card.style.setProperty('--ox', right ? '0px' : w + 'px');
}
function openCard() { card.classList.remove('closing'); if (!card.classList.contains('open')) { card.classList.add('open'); } placeCard(); requestAnimationFrame(placeCard); }
function closeCard() { if (!card.classList.contains('open')) return; card.classList.remove('open'); card.classList.add('closing'); setTimeout(() => card.classList.remove('closing'), 200); }

function show(state, extra = {}) {
  if (state === 'ask') {
    const seen = info.picture ? `<div class="seen"><span class="q">${t('seen')}</span><img src="${info.picture}" alt=""></div>` : '';
    card.innerHTML = head() + seen + `<div class="chips">
      <button data-kind="explain">💡 ${t('explain')}</button><button data-kind="spelling">✏️ ${t('spelling')}</button>
      <button data-kind="translate">🌍 ${t('translate')}</button><button data-kind="summary">📝 ${t('summary')}</button></div>
      ${info.word ? `<div class="q">📄 ${t('wordHint')}</div>` : ''}
      <div class="ask"><textarea rows="1" placeholder="${t('placeholder')}"></textarea><button class="send" data-do="send">↑</button></div>`;
  }
  if (state === 'thinking') card.innerHTML = head() + `<div class="q">${esc(lastQuestion)}</div><div class="wait"><span class="dots"><i></i><i></i><i></i></span><span id="progress">${t('thinking')}</span></div>`;
  if (state === 'answer') {
    const r = extra; answerText = r.answer || '';
    let body = r.ok === false ? `<div class="err">${esc(r.error || '')}</div>` : `<div class="answer">${md(r.answer || '')}`;
    if (r.ok !== false && r.word) {
      if (r.pages) body += `<div class="q" style="margin-top:6px">📄 ${t('pages')(r.pages)}</div>`;
      body += r.fixes?.length ? `<ul class="fixes">${r.fixes.map(f => `<li><span class="p">p. ${esc(f.page ?? '?')}</span><del>${esc(f.find)}</del> → <ins>${esc(f.replace)}</ins>${f.why ? `<span class="why">${esc(f.why)}</span>` : ''}</li>`).join('')}</ul>` : `<div style="margin-top:6px">${t('noFixes')}</div>`;
      answerText += '\n' + (r.fixes || []).map(f => `p. ${f.page}: ${f.find} → ${f.replace}`).join('\n');
    }
    if (r.ok !== false) body += '</div>';
    const put = r.ok !== false && r.word && r.fixes?.length ? `<button class="main" data-do="apply">✓ ${t('put')}</button>` : '';
    card.innerHTML = head() + `<div class="q">${esc(lastQuestion)}</div>` + body + `<div class="row">${put}${r.ok !== false ? `<button data-do="copy">${t('copy')}</button>` : ''}<button data-do="again">${t('again')}</button><button data-do="home">${t('home')}</button></div>`;
  }
  openCard();
}

async function ask(kind, text) {
  lastQuestion = text || card.querySelector(`[data-kind="${kind}"]`)?.textContent.replace(/^\S+\s/, '') || '';
  show('thinking');
  const result = await window.buddy.ask(kind, text);
  if (mode === 'parked') show('answer', result || { ok: false, error: '?' });
}
card.addEventListener('click', async e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.kind) return ask(b.dataset.kind, '');
  const act = b.dataset.do;
  if (act === 'send') { const text = card.querySelector('textarea').value.trim(); if (text) ask('free', text); }
  if (act === 'home') window.buddy.home();
  if (act === 'again') show('ask');
  if (act === 'copy') { window.buddy.copy(answerText); b.textContent = t('copied'); }
  if (act === 'apply') {
    b.disabled = true; b.textContent = t('putting');
    const r = await window.buddy.apply();
    b.outerHTML = `<div class="${r?.ok ? 'q' : 'err'}" style="width:100%">${esc(r?.ok ? t('put_done')(r.applied, r.total) : r?.error || '?')}</div>`;
    placeCard();
  }
});
card.addEventListener('keydown', e => {
  if (e.target.tagName === 'TEXTAREA' && e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); const text = e.target.value.trim(); if (text) ask('free', text); }
});
addEventListener('keydown', e => { if (e.key === 'Escape' && mode === 'parked') window.buddy.home(); });
card.addEventListener('input', e => { if (e.target.tagName === 'TEXTAREA') { e.target.style.height = '40px'; e.target.style.height = Math.min(110, e.target.scrollHeight) + 'px'; } });

// ---------- picking him up again once he is parked ----------
// Drag Kopi to move him somewhere else (he looks again where you let go); a click opens or closes his card.
let press = null;
kopi.addEventListener('pointerdown', e => {
  if (mode !== 'parked' || e.button !== 0) return;
  press = { x: e.clientX, y: e.clientY, id: e.pointerId, moved: false };
  kopi.setPointerCapture(e.pointerId);
});
kopi.addEventListener('pointermove', e => {
  if (!press) return;
  if (!press.moved && Math.hypot(e.clientX - press.x, e.clientY - press.y) < 6) return;
  if (!press.moved) { press.moved = true; mode = 'carry'; letGoSent = false; kopi.classList.add('grabbing'); closeCard(); window.buddy.regrab(); }
  aim.x = e.clientX; aim.y = e.clientY;
});
kopi.addEventListener('pointerup', () => {
  if (!press) return;
  const moved = press.moved; press = null; kopi.classList.remove('grabbing');
  if (moved) letGo();
  else if (card.classList.contains('open')) closeCard(); else { openCard(); }
});

// While you carry him this layer has the mouse: he follows it, and letting go (anywhere) lands him.
function letGo() { if (mode === 'carry' && !press && !letGoSent) { letGoSent = true; window.buddy.letGo(); } }
addEventListener('pointermove', e => {
  if (mode !== 'carry' || press) return;
  aim.x = e.clientX; aim.y = e.clientY;
  if (e.buttons === 0 && !testing) letGo(); // the button is already up
});
addEventListener('pointerup', () => letGo());
addEventListener('mouseup', () => letGo());

// Only Kopi and the card catch the mouse; the rest of this layer lets clicks through.
let over = null;
addEventListener('mousemove', e => {
  if (mode === 'carry' || mode === 'home') return; // buddy-main.cjs decides while he is carried or away
  const el = document.elementFromPoint(e.clientX, e.clientY);
  const now = press !== null || (mode !== 'home' && mode !== 'carry' && !!el && (kopi.contains(el) || card.contains(el)));
  if (now !== over) { over = now; window.buddy.interactive(now); }
});

// ---------- what buddy-main.cjs tells us ----------
window.buddy.onState(s => {
  lang = s.lang === 'ms' ? 'ms' : 'en';
  letGoSent = false;
  if (s.state === 'carry') { // picked up from the island: start where he was and glide to the mouse
    flight = null; mode = 'carry'; alpha = 1; scale = 1; closeCard(); info = {};
    const start = s.from || s.at; P.x = start.x; P.y = start.y;
    V.x = V.y = 0; aim.x = s.at.x; aim.y = s.at.y; setLens(null);
  }
  if (s.state === 'looking') { mode = 'looking'; aim.x = s.at.x; aim.y = s.at.y; squashAt = performance.now(); placeLens(s.lens); setLens('look'); }
  if (s.state === 'ask') { mode = 'parked'; info = s; setLens(null); show('ask'); }
  if (s.state === 'home') { // fly back into the island
    closeCard(); setLens(null); mode = 'home';
    flight = { start: performance.now(), from: { x: P.x, y: P.y }, to: s.to || { x: innerWidth / 2, y: -40 } };
  }
  if (s.state === 'hidden') { flight = null; mode = 'home'; alpha = 0; closeCard(); setLens(null); }
  over = null;
});
window.buddy.onLens(l => { if (mode !== 'carry') return; if (l) { placeLens(l.rect); setLens(l.home ? 'home' : 'carry', l.app); } else setLens(null); });
window.buddy.onMove(m => { if (mode === 'carry' && !press) { aim.x = m.at.x; aim.y = m.at.y; if (m.jump) { P.x = aim.x; P.y = aim.y; } } });
window.buddy.onFrame(url => { $('#face').src = url; });
window.buddy.onProgress(text => { const p = $('#progress'); if (p) p.textContent = text; });
addEventListener('resize', () => { if (card.classList.contains('open')) placeCard(); });
</script></body></html>
