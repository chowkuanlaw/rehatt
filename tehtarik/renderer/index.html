<!-- ======================= WIDGET ======================= -->

<button class="icon" id="btnHide">

</div>
</header>

<div class="row">

<span class="z z1" aria-hidden="true">z</span><span class="z z2" aria-hidden="true">z</span>
</div>

<span class="combo" id="combo" aria-hidden="true"></span>
</button>

<div class="side">
<div class="bubble" id="bubble" role="status"><span id="line"></span></div>

<div id="numbers">
<div class="label" id="lblSession"></div>
<div class="big" id="sLeft">--</div>
<div class="small strong" id="lblLeftIn"></div>
<div class="small muted" id="sSub"></div>
<div class="small pace" id="pace" hidden></div>
<button class="link" id="btnPeekExit" hidden></button>
</div>

<div id="signin" hidden>
<div class="label" id="lblNotSigned"></div>
<p class="small" id="lblSigninText"></p>
<button class="btn primary" id="btnSignIn"></button>
<button class="link" id="btnPeek"></button>
<button class="link" id="btnKey" aria-expanded="false"></button>
<form id="keyForm" hidden>
<label class="small" for="keyInput" id="lblKey"></label>
<input id="keyInput" type="password" autocomplete="off" spellcheck="false" placeholder="sk-ant-...">
<div class="keyrow"><button class="btn" type="submit" id="btnKeySave"></button><span class="small muted" id="keyMsg" role="status"></span></div>
</form>
</div>
</div>
</div>

<section class="week" id="week">
<div class="spread"><span class="label" id="lblWeek"></span><span class="pct" id="wLeft">--</span></div>
<div class="cups" id="cups" aria-hidden="true"></div>
<div class="small muted" id="wSub"></div>
<div class="small muted" id="models" hidden></div>
<div class="small muted" id="extra" hidden></div>
</section>

<button class="link news" id="btnNews" hidden></button>
<footer class="foot">
<span class="sync" id="sync" role="status"></span>
<button class="btn tiny" id="btnRefresh"></button>
</footer>

<!-- compact strip -->
<div class="mini" id="mini">
<button class="miniglass" id="miniGlass">

<polygon points="12,20 108,20 97,160 23,160" class="glassfill"/>

<div class="small muted" id="miniSub"></div>
</div>

<button class="icon" id="btnHide2"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
</div>
</div>
</div>
</main>

<!-- ======================= APP: settings, history, about, welcome ======================= -->
