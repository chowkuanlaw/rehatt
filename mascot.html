// ============================================================
// HELPERS
// ============================================================

function clamp(
  value,
  min = 0,
  max = 1
) {
  return Math.max(
    min,
    Math.min(
      max,
      value
    )
  );
}


function lerp(
  a,
  b,
  t
) {
  return (
    a +
    (
      b -
      a
    ) *
    t
  );
}


function smooth(
  value
) {
  const t =
    clamp(
      value
    );


  return (
    t *
    t *
    (
      3 -
      2 *
      t
    )
  );
}


function range(
  value,
  start,
  end
) {
  return smooth(
    clamp(
      (
        value -
        start
      ) /
      (
        end -
        start
      )
    )
  );
}


function inside(
  x,
  y,
  bounds
) {
  if (!bounds) {
    return false;
  }


  return (
    x >=
      bounds.x &&
    x <=
      bounds.x +
      bounds.width &&
    y >=
      bounds.y &&
    y <=
      bounds.y +
      bounds.height
  );
}


function bodyScale(
  diameter
) {
  return (
    diameter /
    82
  );
}

  ctx.setTransform(

    0,

}

// ============================================================
// AUDIO
// ============================================================

let audioContext =
  null;


function getAudio() {
  if (
    !soundEnabled
  ) {
    return null;
  }


  if (
    !audioContext
  ) {
    audioContext =
      new AudioContext();
  }


  return audioContext;
}


function tone(
  from,
  to,
  duration,
  volume = 0.018,
  delay = 0
) {
  const audio =
    getAudio();


  if (!audio) {
    return;
  }


  try {
    const oscillator =
      audio.createOscillator();


    const gain =
      audio.createGain();


    const start =
      audio.currentTime +
      delay;


    oscillator.type =
      'sine';


    oscillator.frequency
      .setValueAtTime(
        from,
        start
      );


    oscillator.frequency
      .exponentialRampToValueAtTime(
        Math.max(
          20,
          to
        ),
        start +
        duration
      );


    gain.gain
      .setValueAtTime(
        0.0001,
        start
      );


    gain.gain
      .linearRampToValueAtTime(
        volume,
        start +
        0.01
      );


    gain.gain
      .exponentialRampToValueAtTime(
        0.0001,
        start +
        duration
      );


    oscillator.connect(
      gain
    );


    gain.connect(
      audio.destination
    );


    oscillator.start(
      start
    );


    oscillator.stop(
      start +
      duration +
      0.02
    );

  } catch {}
}


function sound(
  name
) {
  if (
    !soundEnabled
  ) {
    return;
  }


  if (
    name ===
    'intro'
  ) {
    tone(

      740,

      0.018,
      0.10
    );
  }


  if (
    name ===
    'peek'

    tone(
      350,
      520,
      0.07,
      0.011
    );
  }


  if (
    name ===
    'open'
  ) {
    tone(
      310,
      570,
      0.12,
      0.017
    );
  }


  if (
    name ===

      510,
      290,

    );
  }


  if (
    name ===

  if (
    name ===

    );

  if (

      760,
      0.19,
      0.021
    );
  }
}


// ============================================================
// TRANSITIONS
// ============================================================

function targetHeight() {
  if (
    currentView ===
    'home'
  ) {
    return UI.HOME_H;
  }


  if (
    currentView ===
    'apps'
  ) {
    return UI.APPS_H;
  }


  if (
    currentView ===
    'settings'
  ) {
    return UI.SETTINGS_H;
  }


  return UI.PROMPT_H;
}


function modeTarget(
  targetMode
) {
  if (
    targetMode ===
    'rest'
  ) {
    return {
      width:
        UI.REST_W,

      height:
        UI.BAR_H,

      radius:
        UI.COMPACT_RADIUS
    };
  }


  if (
    targetMode ===
    'compact'
  ) {
    return {
      width:
        UI.COMPACT_W,

      height:
        UI.COMPACT_H,

      radius:
        UI.COMPACT_H / 2
    };
  }


  return {
    width:
      UI.EXPANDED_W,

    height:
      targetHeight(),

    radius:
      UI.EXPANDED_RADIUS
  };
}


function setMode(
  next,
  playSound = true
) {
  const target =
    modeTarget(
      next
    );


  const same =
    mode ===
      next &&
    Math.abs(
      visual.width -
      target.width
    ) <
      1 &&
    Math.abs(
      visual.height -
      target.height
    ) <
      1;


  if (
    same &&
    !transition
  ) {
    return;
  }


  const growing =
    target.width *
    target.height >
    visual.width *
    visual.height;


  transition = {
    from: {
      ...visual
    },

    to:
      target,

    started:
      performance.now(),

    // Opening and closing use the same speed and the same motion.
    duration:
      380,

    growing
  };


  mode =
    next;


  if (
    playSound
  ) {
    sound(
      growing
        ?
          'open'
        :
          'close'
    );
  }
}


function updateTransition(
  now
) {
  if (
    !transition
  ) {
    return;
  }


  const raw =
    clamp(
      (
        now -
        transition.started
      ) /
      transition.duration
    );


  const amount =
    1 -
    Math.pow(
      1 -
      raw,
      3
    );


  // The shape moves like a spring (Apple's Dynamic Island): it overshoots a few percent and settles.
  // The corners just ease, so the shape never looks bent.
  const springy = transition.ease === 'in' ? raw * raw * raw // the blob squish: slow start, quick end
    : transition.bounce ? 1 - Math.exp(-4.6 * raw) * Math.cos(12.5 * raw) // the blob opening: a real bounce
    : 1 - Math.exp(-7 * raw) * Math.cos(7.2 * raw);


  visual.width =
    lerp(
      transition.from.width,
      transition.to.width,
      springy
    );


  visual.height =
    lerp(
      transition.from.height,
      transition.to.height,
      springy
    );


  visual.radius =
    lerp(
      transition.from.radius,
      transition.to.radius,
      amount
    );


  if (
    raw >=
    1
  ) {
    visual = {
      ...transition.to
    };


    transition =
      null;
  }
}


// ============================================================
// DRAW HELPERS
// ============================================================

function islandPath(
  x,
  y,
  width,
  height,
  radius
) {
  ctx.beginPath();


  ctx.moveTo(
    x,
    y
  );


  ctx.lineTo(
    x +
    width,
    y
  );


  ctx.lineTo(
    x +
    width,
    y +
    height -
    radius
  );


  ctx.quadraticCurveTo(
    x +
    width,
    y +
    height,

    x +
    width -
    radius,
    y +
    height
  );


  ctx.lineTo(
    x +
    radius,
    y +
    height
  );


  ctx.quadraticCurveTo(
    x,
    y +
    height,

    x,
    y +
    height -
    radius
  );


  ctx.closePath();
}


function box(
  x,
  y,
  width,
  height,
  radius,
  fill
) {
  width = Math.max(0, width || 0); height = Math.max(0, height || 0);
  radius = Math.max(0, Math.min(radius || 0, width / 2, height / 2)); // never negative
  ctx.beginPath();


  ctx.roundRect(
    x,
    y,
    width,
    height,
    Math.min(
      radius,
      width /
      2,
      height /
      2
    )
  );


  ctx.fillStyle =
    fill;


  ctx.fill();
}


function text(
  value,
  x,
  y,
  size = 12,
  color = '#fff',
  weight = 400,
  align = 'left',
  maxWidth = null
) {
  // Windows 11 font for a sharp, modern look.
  ctx.font =
    `${weight} ${size}px "Segoe UI Variable Text", "Segoe UI", Arial, sans-serif`;


  ctx.fillStyle =
    color;


  ctx.textAlign =
    align;


  ctx.textBaseline =
    'alphabetic';


  let content =
    String(
      value ||
      ''
    );


  if (
    maxWidth &&
    align ===
    'left'
  ) {
    while (
      content.length >
        1 &&
      ctx.measureText(
        content
      ).width >
        maxWidth
    ) {
      content =
        content.slice(
          0,
          -2
        ) +
        '…';
    }
  }


  ctx.fillText(
    content,
    x,
    y
  );
}



// ============================================================
// SPEAKER
// ============================================================

function drawSpeakerIcon(
  x,
  y,
  muted = false
) {
  ctx.save();


  ctx.strokeStyle =
    '#d8e2d4';


  ctx.fillStyle =
    '#d8e2d4';


  ctx.lineWidth =
    1.5;


  ctx.lineCap =
    'round';


  ctx.lineJoin =
    'round';


  ctx.beginPath();


  ctx.moveTo(
    x -
    8,
    y -
    3
  );


  ctx.lineTo(
    x -
    4,
    y -
    3
  );


  ctx.lineTo(
    x +
    1,
    y -
    7
  );


  ctx.lineTo(
    x +
    1,
    y +
    7
  );


  ctx.lineTo(
    x -
    4,
    y +
    3
  );


  ctx.lineTo(
    x -
    8,
    y +
    3
  );


  ctx.closePath();


  ctx.fill();


  if (
    muted
  ) {
    ctx.beginPath();


    ctx.moveTo(
      x +
      5,
      y -
      5
    );


    ctx.lineTo(
      x +
      11,
      y +
      5
    );


    ctx.moveTo(
      x +
      11,
      y -
      5
    );


    ctx.lineTo(
      x +
      5,
      y +
      5
    );


    ctx.stroke();

  } else {
    ctx.beginPath();


    ctx.arc(
      x +
      1,
      y,
      5,
      -0.75,
      0.75
    );


    ctx.stroke();


    ctx.beginPath();


    ctx.arc(
      x +
      1,
      y,
      9,
      -0.72,
      0.72
    );


    ctx.stroke();
  }


  ctx.restore();
}


// ============================================================
// GHOST
// ============================================================

function drawGhost(
  x,
  y,
  diameter
) {

  const scale =
    bodyScale(
      diameter
    );


  /*
    Cup colour: chosen in
    Settings (kopi-fun.js).
  */

  const look =
    window.__kopiLook?.() ||
    {};


  const shell1 =
    angry >
      0.05
      ?
        '#795151'
      :
        look.shell1 ||
        '#59695d';


  const shell2 =
    angry >
      0.05
      ?
        '#462929'
      :
        look.shell2 ||
        '#344239';


  /*
    The eyes are the traffic light (ai-monitor-ui.js):
    blinking orange = working, orange = question,
    green = done, red = error.
  */

  const status =
    window.__kopiEyes?.();


  const eye =
    angry >
      0.05
      ?
        '#ff6b6b'
      :
        status?.color ||
        look.eye ||
        '#e3ffd4';


  const eyeAlpha =
    status?.blink
      ?
        0.3 +
        0.7 *
        (
          0.5 +
          0.5 *
          Math.cos(
            performance.now() /
            200
          )
        )
      :
        1;


  ctx.save();


  ctx.translate(
    x,
    y
  );


  ctx.rotate(
    Math.sin(
      performance.now() *
      0.006
    ) *
    0.08 *
    dizzy
  );


  ctx.scale(
    scale,
    scale
  );


  /*
    kopi-fun.js: jumping, dancing,
    faces and outfits.
  */

  const fx =
    window.__kopiGhostFx?.() ||
    {};


  ctx.translate(
    0,
    fx.dy || 0
  );


  // sx / sy: squash and stretch (wider + lower, or thinner + taller), like a jelly blob.
  ctx.scale(
    (fx.scale ?? 1) * (fx.sx ?? 1), // ?? not ||: a scale of 0 must really make him invisible
    (fx.scale ?? 1) * (fx.sy ?? 1)
  );


  ctx.rotate(
    fx.tilt || 0
  );


  // "Cloud" look: a bright white, soft rounded blob with dark eyes (the eyes take the traffic-light colour),
  // and a small status dot. Pops on the black island.
  if (look.style === 'blob') {
    drawBlob(look, status, eye, eyeAlpha, fx);
    window.__kopiGhostDecor?.(ctx);
    ctx.restore();
    return;
  }


  ctx.beginPath();


  ctx.moveTo(
    -8,
    -28
  );


  ctx.quadraticCurveTo(
    0,
    -42,
    8,
    -28
  );


  ctx.lineTo(
    13,
    -13
  );


  ctx.fillStyle =
    shell2;


  ctx.fill();


  const gradient =
    ctx.createRadialGradient(
      -13,
      -10,
      3,
      0,
      0,
      43
    );


  gradient.addColorStop(
    0,
    shell1
  );


  gradient.addColorStop(
    1,
    '#101511'
  );


  ctx.beginPath();


  ctx.ellipse(
    0,
    0,
    41,
    32,
    0,
    0,
    Math.PI *
    2
  );


  ctx.fillStyle =
    gradient;


  ctx.fill();


  ctx.beginPath();


  ctx.ellipse(
    0,
    3,
    28,
    22,
    0,
    0,
    Math.PI *
    2
  );


  ctx.fillStyle =
    '#030504';


  ctx.fill();


  for (
    const side of [
      -1,
      1
    ]
  ) {
    ctx.save();


    ctx.translate(
      side *
      15 +
      ghostLookX,

      3 +
      ghostLookY
    );


    ctx.globalAlpha *=
      eyeAlpha;


    ctx.shadowColor =
      eye;


    ctx.shadowBlur =
      status
        ? 14
        : 9;


    drawEye(
      side,
      eye,
      angry > 0.05
        ? null
        : fx.mood
    );


    ctx.restore();
  }


  window.__kopiGhostDecor?.(
    ctx
  );


  ctx.restore();
}


// "Kopi" look: a kopi-O cup with a kopitiam green rim, sitting on its saucer. The steam is the status light
// (orange = Claude busy, your colour = done, red = error) and the cup glows in that colour too.
// Drawn in the same box the old character used (about x -46..46, y -50..34), so hats and effects still line up.
const KOPI = { ink: '#3B2A20', rim: '#2E8B57', coffee: '#5A3420', saucer: '#EDE6DA', saucerLine: '#C9BBA6', blush: 'rgba(244,166,160,.8)', handle: '#F3E6CF' };
const KOPI_S = 0.85; // scale from the 120-unit design grid
const kx = x => (x - 60) * KOPI_S, ky = y => (y - 44) * KOPI_S - 22;
function drawBlob(look, status, eye, eyeAlpha, fx) {
  const top = angry > 0.05 ? '#fff0f0' : look.shell1 || '#FFFDF8';
  const tint = angry > 0.05 ? '#ffd9d9' : look.shell2 || '#EFE6D8';
  const mood = angry > 0.05 ? 'angry' : fx.mood;
  const empty = mood === 'hungry' || window.__kopiHungry?.() === true;
  const now = performance.now();

  // shadow and saucer
  ctx.save(); ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.beginPath(); ctx.ellipse(0, 34, 34, 4, 0, 0, Math.PI * 2); ctx.fill(); ctx.restore();
  ctx.save(); ctx.beginPath(); ctx.ellipse(0, ky(104), 44 * KOPI_S, 8 * KOPI_S, 0, 0, Math.PI * 2);
  ctx.fillStyle = KOPI.saucer; ctx.fill(); ctx.lineWidth = 1.6; ctx.strokeStyle = KOPI.saucerLine; ctx.stroke(); ctx.restore();

  // steam: three wisps that sway; they carry the status colour and blink when Claude needs you
  if (!empty) {
    const wearing = !!window.__kopiOutfitOn?.();
    const steam = status?.color || 'rgba(217,203,184,.85)';
    const blink = status?.blink ? 0.55 + 0.45 * Math.cos(now / 200) : 1;
    ctx.save(); ctx.strokeStyle = steam; ctx.lineWidth = status?.color ? 3 : 2.4; ctx.lineCap = 'round'; ctx.globalAlpha = blink;
    if (status?.color) { ctx.shadowColor = steam; ctx.shadowBlur = 12; }
    for (const [i, x] of [[0, -11], [1, 0], [2, 11]]) {
      if (wearing && i === 1) continue; // the hat sits where the middle wisp would be
      const sway = Math.sin(now / 420 + i * 1.7) * 2.2, base = wearing ? -40 : -30, lift = (now / 900 + i * 0.33) % 1;
      ctx.globalAlpha = blink * (0.45 + 0.55 * (1 - lift));
      ctx.beginPath(); ctx.moveTo(x, base - lift * 3);
      ctx.bezierCurveTo(x - 5 + sway, base - 6 - lift * 3, x + 5 + sway, base - 10 - lift * 3, x + sway, base - 16 - lift * 3);
      ctx.stroke();
    }
    ctx.restore();
  }

  // handle (light, so it shows on the black island)
  ctx.save(); ctx.strokeStyle = KOPI.handle; ctx.lineWidth = 4.5; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(kx(94), ky(58)); ctx.bezierCurveTo(kx(112), ky(60), kx(109), ky(78), kx(95), ky(84)); ctx.stroke(); ctx.restore();

  // cup body, glowing in the status colour
  const cup = () => {
    ctx.beginPath(); ctx.moveTo(kx(24), ky(44)); ctx.lineTo(kx(30), ky(92));
    ctx.quadraticCurveTo(kx(32), ky(100), kx(40), ky(100)); ctx.lineTo(kx(80), ky(100));
    ctx.quadraticCurveTo(kx(88), ky(100), kx(90), ky(92)); ctx.lineTo(kx(96), ky(44)); ctx.closePath();
  };
  const glaze = ctx.createLinearGradient(0, ky(44), 0, ky(100));
  glaze.addColorStop(0, top); glaze.addColorStop(1, tint);
  ctx.save(); ctx.shadowColor = status?.color || 'rgba(255,255,255,.25)'; ctx.shadowBlur = status?.color ? 14 : 8;
  cup(); ctx.fillStyle = glaze; ctx.fill(); ctx.restore();
  ctx.save(); cup(); ctx.lineWidth = 2.4; ctx.lineJoin = 'round'; ctx.strokeStyle = KOPI.ink; ctx.stroke();
  // the green kopitiam band, clipped to the cup
  cup(); ctx.clip(); ctx.fillStyle = KOPI.rim; ctx.fillRect(kx(20), ky(53), 80 * KOPI_S, 8 * KOPI_S); ctx.restore();

  // rim and the kopi inside (an empty cup shows just a little ring at the bottom)
  ctx.save(); ctx.beginPath(); ctx.ellipse(0, ky(44), 36 * KOPI_S, 8 * KOPI_S, 0, 0, Math.PI * 2);
  ctx.fillStyle = top; ctx.fill(); ctx.lineWidth = 2.4; ctx.strokeStyle = KOPI.ink; ctx.stroke();
  ctx.beginPath(); ctx.ellipse(0, ky(44), 30 * KOPI_S, 5 * KOPI_S, 0, 0, Math.PI * 2); ctx.fillStyle = empty ? '#EFE5D6' : KOPI.coffee; ctx.fill();
  if (empty) { ctx.beginPath(); ctx.ellipse(0, ky(46), 8 * KOPI_S, 1.4 * KOPI_S, 0, 0, Math.PI * 2); ctx.fillStyle = '#8A6A55'; ctx.fill(); }
  ctx.restore();

  // face: dark eyes (they keep every mood from drawEye), rosy cheeks and a small mouth
  const faceY = ky(76);
  for (const side of [-1, 1]) {
    ctx.save(); ctx.translate(side * 10.2 + ghostLookX * 0.6, faceY + ghostLookY * 0.6); ctx.scale(0.62, 0.62);
    ctx.globalAlpha *= eyeAlpha;
    drawEye(side, KOPI.ink, mood === 'angry' ? null : mood);
    ctx.restore();
  }
  ctx.save(); ctx.fillStyle = KOPI.blush;
  for (const side of [-1, 1]) { ctx.beginPath(); ctx.ellipse(side * 17 + ghostLookX * 0.4, ky(85), 4, 2.4, 0, 0, Math.PI * 2); ctx.fill(); }
  ctx.restore();
  drawKopiMouth(mood, ghostLookX * 0.5, ky(84) + ghostLookY * 0.5);
}

function drawKopiMouth(mood, x, y) {
  ctx.save(); ctx.translate(x, y); ctx.strokeStyle = KOPI.ink; ctx.fillStyle = KOPI.ink; ctx.lineWidth = 2.2; ctx.lineCap = 'round';
  ctx.beginPath();
  if (mood === 'surprised' || mood === 'curious' || mood === 'focus') { ctx.arc(0, 2, 2.6, 0, Math.PI * 2); ctx.stroke(); }
  else if (mood === 'sad' || mood === 'angry' || mood === 'hungry') { ctx.moveTo(-5, 4); ctx.quadraticCurveTo(0, -1, 5, 4); ctx.stroke(); }
  else if (mood === 'sleep') { ctx.moveTo(-3, 2); ctx.lineTo(3, 2); ctx.stroke(); }
  else if (mood === 'happy' || mood === 'heart') { ctx.moveTo(-7, 0); ctx.quadraticCurveTo(0, 9, 7, 0); ctx.closePath(); ctx.fill(); }
  else { ctx.moveTo(-6, 0); ctx.quadraticCurveTo(0, 6, 6, 0); ctx.stroke(); }
  ctx.restore();
}

/*
  Faces:
  focus = squinting, curious = big eyes,
  happy = ^ ^, sad = droopy eyes,
  sleep = closed eyes.
*/

function drawEye(
  side,
  eye,
  mood
) {
  ctx.fillStyle =
    eye;


  ctx.strokeStyle =
    eye;


  ctx.lineWidth =
    3;


  ctx.lineCap =
    'round';


  ctx.beginPath();


  if (
    mood ===
    'happy'
  ) {
    ctx.arc(
      0,
      3,
      5,
      Math.PI * 1.15,
      Math.PI * 1.85
    );


    ctx.stroke();


    return;
  }


  if (
    mood ===
    'heart'
  ) {
    ctx.moveTo(
      0,
      6
    );


    ctx.bezierCurveTo(
      -9, -1,
      -5, -9,
      0, -4
    );


    ctx.bezierCurveTo(
      5, -9,
      9, -1,
      0, 6
    );


    ctx.fillStyle =
      '#ff5c8a';


    ctx.fill();


    return;
  }


  if (
    mood ===
    'dizzy'
  ) {
    // Spinning spiral eyes
    const turn =
      performance.now() /
      140 *
      side;


    for (
      let a = 0;
      a < Math.PI * 4;
      a += 0.3
    ) {
      const r =
        a *
        0.55;


      ctx.lineTo(
        Math.cos(a + turn) * r,
        Math.sin(a + turn) * r
      );
    }


    ctx.lineWidth =
      2.2;


    ctx.stroke();


    return;
  }


  if (
    mood ===
      'wink' &&
    side ===
      1
  ) {
    ctx.moveTo(
      -5,
      2
    );


    ctx.lineTo(
      5,
      2
    );


    ctx.stroke();


    return;
  }


  if (
    mood ===
      'sleep' ||
    mood ===
      'blink'
  ) {
    ctx.arc(
      0,
      -2,
      5,
      Math.PI * 0.15,
      Math.PI * 0.85
    );


    ctx.stroke();


    return;
  }


  if (
    mood ===
    'focus'
  ) {
    ctx.ellipse(
      0,
      1,
      5.5,
      4,
      0,
      0,
      Math.PI * 2
    );
  } else if (
    mood ===
    'sad'
  ) {
    ctx.ellipse(
      0,
      2,
      4.5,
      6.5,
      side * -0.45,
      0,
      Math.PI * 2
    );
  } else if (
    mood ===
    'surprised'
  ) {
    ctx.arc(
      0,
      0,
      7,
      0,
      Math.PI * 2
    );
  } else if (
    mood ===
    'curious'
  ) {
    ctx.ellipse(
      0,
      0,
      6,
      9.5,
      0,
      0,
      Math.PI * 2
    );
  } else {
    ctx.ellipse(
      0,
      0,
      5,
      8,
      0,
      0,
      Math.PI * 2
    );
  }


  ctx.fill();
}


// ============================================================
// ISLAND
// ============================================================

function drawIsland() {
  const centerX =
    innerWidth /
    2;


  const x =
    centerX -
    visual.width /
    2;


  islandBounds = {
    x,

    y:
      0,

    width:
      visual.width,

    height:
      visual.height
  };


  // Soft glow in Claude's colour around the island (like light from the stoplight eyes).
  const glow =
    window.__kopiEyes?.()?.color;


  ctx.save();


  ctx.shadowColor =
    glow
      ? glow + '55'
      : 'rgba(0,0,0,.42)';


  ctx.shadowBlur =
    glow
      ? 22
      : 16;


  ctx.shadowOffsetY =
    glow
      ? 2
      : 4;


  islandPath(
    x,
    0,
    visual.width,
    visual.height,
    visual.radius
  );


  ctx.fillStyle =
    '#000';


  ctx.fill();


  ctx.restore();


  // Subtle top-lit edge: brighter at the bottom rim, like glass.
  islandPath(
    x,
    0,
    visual.width,
    visual.height,
    visual.radius
  );


  const edge =
    ctx.createLinearGradient(
      0,
      0,
      0,
      visual.height
    );


  edge.addColorStop(
    0,
    'rgba(255,255,255,.02)'
  );


  edge.addColorStop(
    1,
    glow
      ? glow + '40'
      : 'rgba(255,255,255,.10)'
  );


  ctx.strokeStyle =
    edge;


  ctx.lineWidth =
    1;


  ctx.stroke();
}

// ============================================================
// INTRO
// ============================================================

const introStarted =
  performance.now();


let introFinished =
  false;


function drawIntro(
  now
) {
  const centerX =
    innerWidth /
    2;


  const progress =
    clamp(
      (
        now -
        introStarted
      ) /
      1200
    );


  const grow =
    range(
      progress,
      0,
      0.34
    );


  const settle =
    range(
      progress,
      0.62,
      1
    );


  const width =
    lerp(
      UI.REST_W,
      UI.COMPACT_W,
      grow
    );


  visual.width =
    lerp(
      width,
      UI.REST_W,
      settle
    );


  visual.height =
    UI.BAR_H;


  visual.radius =
    UI.COMPACT_RADIUS;


  drawIsland();


  drawGhost(
    centerX,
    12,
    16
  );


  if (
    progress >=
      1 &&
    !introFinished
  ) {
    introFinished =
      true;


    mode =
      'rest';


    visual = {
      width:
        UI.REST_W,

      height:
        UI.BAR_H,

      radius:
        UI.COMPACT_RADIUS
    };


    sound(
      'intro'
    );
  }
}

// ============================================================

window.kopi.onPointer(
  position => {
    if (
      !position ||
      !Number.isFinite(
        position.x
      ) ||
      !Number.isFinite(
        position.y
      )
    ) {
      return;
    }


    pointer = {
      x:
        position.x,

      y:
        position.y,

      known:
        Boolean(
          position.insideWindow
        )
    };
  }
);

// ============================================================
// HOVER
// ============================================================

function updateHover(
  now
) {
  if (
    !introFinished
  ) {
    return;
  }




  const over =
    pointer.known &&
    inside(
      pointer.x,
      pointer.y,
      islandBounds
    );


  if (
    mode ===
    'rest'
  ) {
    if (
      over
    ) {
      hoverStartedAt =
        now;


      // Silent: the "open" sound plays once, when it really opens.
      setMode(
        'compact',
        false
      );
    }


    return;
  }


  if (
    mode ===
    'compact'
  ) {
    if (
      over
    ) {
      if (
        hoverStartedAt ===
        null
      ) {
        hoverStartedAt =
          now;
      }


      if (
        now -
        hoverStartedAt >
        UI.NORMAL_PEEK_DELAY
      ) {
        setMode(
          'expanded'
        );


        hoverStartedAt =
          null;
      }

    } else {
      setMode(
        'rest'
      );
    }


    return;
  }


  if (
    mode ===
    'expanded'
  ) {
    /*
      Every screen folds away when you are not using it.
      Not while you type: then it stays open.
    */

    if (
      !over &&
      !isTyping()
    ) {
      if (
        leaveStartedAt ===
        null
      ) {
        leaveStartedAt =
          now;
      }


      const delay =
        currentView ===
          'home'
          ? UI.HOME_LEAVE_DELAY
          : UI.VIEW_LEAVE_DELAY;


      if (
        now -
        leaveStartedAt >
        delay
      ) {
        collapseIdle();


        leaveStartedAt =
          null;
      }

    } else {
      leaveStartedAt =
        null;
    }
  }
}


function isTyping() {
  const element =
    document.activeElement;


  return (
    document.hasFocus() &&
    Boolean(
      element &&
      (
        element.tagName === 'INPUT' ||
        element.tagName === 'TEXTAREA' ||
        element.isContentEditable
      )
    )
  );
}


function collapseIdle() {
  /*
    Same as Escape: back to home and small.
    island-window-ui.js puts the screen back when you click the island again.
  */

  if (
    currentView !==
    'home'
  ) {
    projectInput.blur();


    projectInput.style.display =
      'none';


    currentView =
      'home';
  }


  setMode(
    'rest'
  );
}


// ============================================================
// CHARACTER
// ============================================================

function updateCharacter(
  dt
) {
  let ghostX =
    innerWidth /
    2;


  let ghostY =
    12;


  if (
    mode ===
    'expanded'
  ) {
    const content =
      contentRect();


    ghostX =
      content.x +
      45;


    ghostY =
      content.y +
      content.height /
      2;
  }


  const targetX =
    pointer.known
      ?
        Math.tanh(
          (
            pointer.x -
            ghostX
          ) /
          260
        ) *
        4
      :
        0;


  const targetY =
    pointer.known
      ?
        Math.tanh(
          (
            pointer.y -
            ghostY
          ) /
          200
        ) *
        2.8
      :
        0;


  ghostLookX +=
    (
      targetX -
      ghostLookX
    ) *
    (
      1 -
      Math.exp(
        -10 *
        dt
      )
    );


  ghostLookY +=
    (
      targetY -
      ghostLookY
    ) *
    (
      1 -
      Math.exp(
        -10 *
        dt
      )
    );
}


// ============================================================
// EXPANDED
// ============================================================

function drawExpanded(
  alpha
) {
  const content =
    contentRect();


  drawHeader(
    alpha
  );


  ctx.save();


  ctx.globalAlpha =
    alpha;


  ctx.beginPath();


  ctx.rect( content.x - 16, content.y - 10, content.width + 32, content.height + 20 ); // a little room: wiggling widgets and their badges never get cut off


  ctx.clip();


  if (
    currentView ===
    'home'
  ) {
    drawHome(
      content
    );
  }


  if (
    currentView ===
    'apps'
  ) {
    drawApps(
      content
    );
  }


  if (
    currentView ===
    'settings'
  ) {
    drawSettings(
      content
    );
  }


  ctx.restore();
}



// ============================================================
// INTERACTIVE
// ============================================================

// Whether the window catches clicks (on the island) or lets them through to the apps below (Chrome, ...).
// Everything goes through here. Once a second the state is sent again anyway, so it can never get stuck
// (it used to stay "catching clicks" after Claude finished, until you hovered Rehatt).
let interactiveSentAt = 0;

function sendInteractive(
  next
) {
  // while Kopi is carried the island keeps the mouse, so letting go anywhere on screen reaches us
  if (window.__kopiDragging?.()) next = true;
  if (
    next ===
    interactiveSent &&
    performance.now() - interactiveSentAt < 1000
  ) {
    return;
  }


  interactiveSent =
    next;

  interactiveSentAt =
    performance.now();


  window.kopi
    .setIslandInteractive(
      next
    );
}


// "Typing" only counts while a visible text field really has focus and Rehatt's window is active.
// (A text field that was removed or hidden while focused used to keep this on forever.)
function typingNow() {
  const el =
    document.activeElement;

  return Boolean(
    projectInputFocused &&
    document.hasFocus() &&
    el &&
    /^(INPUT|TEXTAREA)$/.test(el.tagName) &&
    el.offsetParent !== null
  );
}


// ============================================================
// RENDER
// ============================================================

let lastFrame =
  performance.now();


function drawIslandFrame(
  now
) {
  const dt =
    Math.min(
      (
        now -
        lastFrame
      ) /
      1000,
      0.04
    );


  lastFrame =
    now;


  ctx.clearRect(
    0,
    0,
    innerWidth,
    innerHeight
  );


  hit = {};


  if (
    !introFinished
  ) {
    drawIntro(
      now
    );


    projectInput.style.display =
      'none';


    sendInteractive(
      false
    );


    


    return;
  }


  updateTransition(
    now
  );


  drawIsland();


  updateHover(
    now
  );


  updateCharacter(
    dt
  );


  ctx.save();


  islandPath(
    islandBounds.x,
    0,
    islandBounds.width,
    islandBounds.height,
    visual.radius
  );


  ctx.clip();


  const alpha =
    range(
      visual.width,
      360,
      600
    );


  // Small content in the small/medium island (it can be wide, e.g. with answer buttons), big content when open.
  if (
    mode !== 'expanded' ||
    visual.width <
    380
  ) {
    drawSmall();

  } else {
    drawExpanded(
      alpha
    );
  }


  ctx.restore();


  const overIsland =
    pointer.known &&
    inside(
      pointer.x,
      pointer.y,
      islandBounds
    );


  const overHit =
    pointer.known &&
    Object.values(
      hit
    ).some(
      bounds =>
        inside(
          pointer.x,
          pointer.y,
          bounds
        )
    );


  // Catch the mouse only while it is really on the island. Typing does not need it (keyboard focus
  // stays anyway), and catching the mouse while typing made the invisible window (860×320, over the
  // browser's tabs and address bar) eat clicks meant for Chrome until you clicked Rehatt again.
  sendInteractive(
    overIsland ||
    overHit
  );


  const cursorNow = overHit ? 'pointer' : 'default';

  if (canvas.style.cursor !== cursorNow) {
    canvas.style.cursor = cursorNow;
  }


  
}



let kopiLastFrameError = -Infinity;
let kopiLastDraw = -Infinity;

function render(now) {
  try {
    // Resting and the mouse is elsewhere: 30 frames a second is plenty for the small pill
    // and halves the work the PC does all day long.
    if (mode === 'rest' && !pointer.known && now - kopiLastDraw < 30) return;
    kopiLastDraw = now;
    drawIslandFrame(now);
  } catch (error) {
    if (now - kopiLastFrameError >= 1000) {
      kopiLastFrameError = now;

      console.error(
        '[Rehatt frame]',
        error.stack || error.message || String(error)
      );
    }

    try { ctx.reset?.(); } catch {} // a half-drawn frame can leave ctx.save() states behind
    try {
      resize();
    } catch {}
    // Still decide if the window catches clicks: otherwise one broken frame left the island "click-through"
    // until you hovered or clicked Rehatt again.
    try { sendInteractive(pointer.known && inside(pointer.x, pointer.y, islandBounds)); } catch {}
  } finally {
    requestAnimationFrame(render);
  }
}

requestAnimationFrame(
  render
);


// ============================================================
// LOCAL POINTER
// ============================================================

addEventListener(
  'mousemove',

  event => {
    pointer.x =
      event.clientX;


    pointer.y =
      event.clientY;


    pointer.known =
      true;
  }
);


// ============================================================
// CLICK
// ============================================================

canvas.addEventListener(
  'click',

  async event => {
    const x =
      event.clientX;


    const y =
      event.clientY;


    // ======================================================
    // SMALL ISLAND
    // ======================================================

    if (
      mode !==
        'expanded' &&
      inside(
        x,
        y,
        islandBounds
      )
    ) {
      setMode(
        'expanded'
      );


      return;
    }


    // ======================================================
    // HEADER
    // ======================================================

    if (
      inside(
        x,
        y,
        hit.home
      )
    ) {
      setView(
        'home'
      );


      return;
    }


    if (
      inside(
        x,
        y,
        hit.apps
      )
    ) {
      setView(
        'apps'
      );


      return;
    }


    if (
      inside(
        x,
        y,
        hit.settings
      )
    ) {
      setView(
        'settings'
      );


      return;
    }


    if (
      inside(
        x,
        y,
        hit.sound
      )
    ) {
      soundEnabled =
        !soundEnabled;


      localStorage.setItem(
        'kopi:sound',
        soundEnabled
          ?
            'on'
          :
            'off'
      );


      return;
    }


    // ======================================================
    // APPS
    // ======================================================

    for (const [, , , key, view] of APP_PILLS) {
      if (!inside(x, y, hit[key])) continue;
      if (view === 'monitor') window.__kopiMonitor?.open('claudecode'); else setView(view);
      return;
    }
  }
);


// ============================================================
// ESCAPE
// ============================================================

addEventListener(
  'keydown',

  event => {
    if (
      event.key !==
      'Escape'
    ) {
      return;
    }


    if (
      document.activeElement ===
      projectInput
    ) {
      projectInput.blur();

      return;
    }


    currentView =
      'home';


    projectInput.style.display =
      'none';


    setMode(
      'rest'
    );
  }
);


</script>
