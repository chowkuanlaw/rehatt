name: Build Windows app

# Builds Rehatt for Windows:
#   Rehatt-Setup-<version>.exe (+ .blockmap, latest.yml)  per-user installer that updates itself from these releases
#   Rehatt-<version>-win.zip                              portable copy (says when a new version is out)
# - Every push to main, or "Run workflow" in the Actions tab: kept as a download on the run.
# - Publishing a release on GitHub: also attached to that release, which is what installed copies update from.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Attach the build to this existing release tag (e.g. v0.1.1). Leave empty for a plain build.'
        required: false
        default: ''
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Which release
        id: rel
        shell: bash
        run: echo "tag=${{ github.event.release.tag_name || inputs.release_tag }}" >> "$GITHUB_OUTPUT"

      - name: Take the version from the release tag
        if: steps.rel.outputs.tag != ''
        shell: bash
        run: npm version "${TAG#v}" --no-git-tag-version --allow-same-version
        env:
          TAG: ${{ steps.rel.outputs.tag }}

      - name: Test
        shell: bash
        run: |
          # On failure, also post the failing tests as an annotation so they show on the run page
          if ! npm test > test-output.txt 2>&1; then
            cat test-output.txt
            msg=$(grep -E -A25 '^not ok|^# (fail|pass)' test-output.txt | head -c 3500 | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
            echo "::error title=Tests failed::$msg"
            exit 1
          fi
          tail -n 12 test-output.txt

      - name: Smoke test (open every screen, take screenshots)
        if: github.event_name != 'release'
        shell: bash
        env:
          REHATT_SMOKE: smoke
        run: |
          timeout 300 npx electron . || echo "electron exit $?"
          ls smoke
          if [ -s smoke/errors.txt ]; then
            cat smoke/errors.txt
            msg=$(head -c 3500 smoke/errors.txt | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
            echo "::warning title=Smoke test messages::$msg"
          fi

      - name: Keep the screenshots on the ci-smoke branch
        if: github.event_name != 'release'
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/shots" && cp smoke/* "$RUNNER_TEMP/shots/"
          git config user.name "ci" && git config user.email "ci@users.noreply.github.com"
          git worktree add --orphan -b ci-smoke "$RUNNER_TEMP/ci-smoke"
          cd "$RUNNER_TEMP/ci-smoke" && cp "$RUNNER_TEMP"/shots/* . && echo "${GITHUB_SHA}" > commit.txt
          git add -A && git commit -q -m "Smoke screenshots for ${GITHUB_SHA::7}" && git push -f -q origin ci-smoke

      - name: Build installer and zip
        run: npx electron-builder --win nsis zip --x64 --publish never

      - name: Upload to the run
        uses: actions/upload-artifact@v4
        with:
          name: Rehatt-Windows
          path: |
            dist/*.zip
            dist/Rehatt-Setup-*.exe
            dist/Rehatt-Setup-*.exe.blockmap
            dist/latest.yml
          retention-days: 30

      - name: Attach to the release
        if: steps.rel.outputs.tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.rel.outputs.tag }}
        run: |
          # replace any older build on this release, then upload the new one (latest.yml is what installed copies read)
          for old in $(gh release view "$TAG" --json assets --jq '.assets[].name' | grep -E -- '-win\.zip$|^Rehatt-Setup-|^latest\.yml$' || true); do
            gh release delete-asset "$TAG" "$old" --yes
          done
          gh release upload "$TAG" dist/*.zip dist/Rehatt-Setup-*.exe dist/Rehatt-Setup-*.exe.blockmap dist/latest.yml --clobber
